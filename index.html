<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta Arcade & Esports Hub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">🎮 Mega Arcade</div>
        <div class="nav-right">
            <div id="token-display" class="token-pill">🪙 <span id="coin-count">0</span> Tokens</div>
            <button id="auth-btn" class="btn-primary">Sign In</button>
        </div>
    </header>

    <div class="platform-tabs">
        <button class="tab-btn active" onclick="switchPlatform('mobile')">📱 Mobile Games (10)</button>
        <button class="tab-btn" onclick="switchPlatform('pc')">💻 PC Games (5)</button>
    </div>

    <main class="container">
        <h2 id="section-title">Mobile Touch Arcade</h2>
        <div class="game-grid" id="game-grid">
            <div class="game-card" onclick="launchGame('ping-spike')">
                <span class="badge mobile">Mobile</span>
                <h3>Ping Spike Panic</h3>
                <p>High-latency reflex challenge</p>
            </div>
            <!-- More game cards will be added here -->
        </div>
    </main>

    <script type="module" src="js/firebase-config.js"></script>
    <script>
        function switchPlatform(platform) {
            const title = document.getElementById('section-title');
            const grid = document.getElementById('game-grid');
            if (platform === 'pc') {
                title.innerText = "PC Keyboard & Mouse Arcade";
                grid.innerHTML = `<div class="game-card"><span class="badge pc">PC</span><h3>Chess Master 2D</h3><p>WASD / Mouse board battle</p></div>`;
            } else {
                title.innerText = "Mobile Touch Arcade";
                location.reload();
            }
        }
        function launchGame(gameName) {
            alert("Launching game: " + gameName);
        }
    </script>
</body>
</html>
