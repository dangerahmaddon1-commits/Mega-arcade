<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Arcade - Play 50 Free Online HTML5 Games</title>
  <meta name="description" content="Play 50 free online HTML5 games on Mega Arcade. Action, puzzle, arcade, racing, sports, and casual games playable on mobile and desktop without downloads.">
  <meta name="robots" content="index, follow">
  
  <!-- Google AdSense Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8537779348532569" crossorigin="anonymous"></script>

  <!-- Vercel Analytics -->
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --border-color: #1e293b;
      --accent-glow: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #070a12;
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-glow);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-bar {
      flex: 1;
      max-width: 400px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.6rem 1rem;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
    }

    .search-bar input:focus {
      border-color: var(--accent-glow);
    }

    /* Cross-Promotion Bar */
    .promo-bar {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      padding: 0.75rem 1rem;
      background: #0f172a;
      border-bottom: 1px solid var(--border-color);
    }

    .promo-banner {
      background: linear-gradient(135deg, #1e293b, #0f172a);
      border: 1px solid #334155;
      padding: 0.4rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .promo-banner a {
      color: var(--accent-glow);
      text-decoration: none;
      font-weight: 700;
    }

    main {
      max-width: 1200px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      flex: 1;
      width: 100%;
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.8rem;
      margin-bottom: 1.5rem;
      scrollbar-width: thin;
    }

    .cat-btn {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn:hover, .cat-btn.active {
      background: var(--accent-glow);
      color: #0b0f19;
      border-color: var(--accent-glow);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: var(--accent-glow);
    }

    /* Reliable Styled Thumbnail Box */
    .thumbnail-box {
      width: 100%;
      aspect-ratio: 4/3;
      background: linear-gradient(135deg, #1e293b, #0f172a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .thumbnail-icon {
      font-size: 2.2rem;
    }

    .thumbnail-text {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-glow);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .game-info {
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .game-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .game-cat {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: capitalize;
    }

    /* Fullscreen Game View Overlay with Fullscreen Option */
    .player-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 18, 0.98);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .player-modal.active {
      display: flex;
    }

    .player-container {
      width: 100%;
      max-width: 1100px;
      height: 90vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }

    .player-header {
      background: #070a12;
      padding: 0.75rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
    }

    .player-actions {
      display: flex;
      gap: 0.5rem;
    }

    .action-btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.8rem;
    }

    .action-btn:hover {
      background: var(--accent-glow);
      color: #0b0f19;
    }

    .close-btn {
      background: #ef4444;
      color: #fff;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .game-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #000;
    }

    footer {
      background: #070a12;
      border-top: 1px solid var(--border-color);
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="logo">🎮 Mega Arcade</a>
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search 50 games..." onkeyup="filterGames()">
      </div>
    </div>
  </header>

  <!-- Cross-Promotion Network Bar -->
  <div class="promo-bar">
    <div class="promo-banner">🎙️ <a href="https://mic-testpro.vercel.app/" target="_blank">Mic Test Utility</a></div>
    <div class="promo-banner">⌨️ <a href="https://keyboardtest-pro.vercel.app/" target="_blank">Keyboard Test Pro</a></div>
    <div class="promo-banner">🖥️ <a href="https://screentestpropro.vercel.app/" target="_blank">Screen Test Utility</a></div>
    <div class="promo-banner">🌐 <a href="https://netsetgopro.vercel.app" target="_blank">NetSetGo Pro</a></div>
  </div>

  <main>
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('all', this)">All Games</button>
      <button class="cat-btn" onclick="filterCategory('action', this)">Action</button>
      <button class="cat-btn" onclick="filterCategory('arcade', this)">Arcade</button>
      <button class="cat-btn" onclick="filterCategory('racing', this)">Racing</button>
      <button class="cat-btn" onclick="filterCategory('puzzle', this)">Puzzle</button>
      <button class="cat-btn" onclick="filterCategory('sports', this)">Sports</button>
      <button class="cat-btn" onclick="filterCategory('casual', this)">Casual</button>
    </div>

    <div class="game-grid" id="gameGrid"></div>
  </main>

  <!-- Fullscreen / Large View Modal Player -->
  <div class="player-modal" id="playerModal">
    <div class="player-container" id="playerContainer">
      <div class="player-header">
        <span id="modalTitle" style="font-weight: 700; color: var(--accent-glow);">Playing Game</span>
        <div class="player-actions">
          <button class="action-btn" onclick="toggleFullScreen()">⛶ Fullscreen</button>
          <button class="close-btn" onclick="closeGame()">✕ Close</button>
        </div>
      </div>
      <iframe class="game-iframe" id="gameIframe" src="" allowfullscreen></iframe>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 Mega Arcade. Play free online HTML5 games on mobile and desktop.</p>
  </footer>

  <script>
    // 50 Hand-curated arcade games with direct playable links
    const games = Array.from({ length: 50 }, (_, i) => {
      const id = i + 1;
      const categories = ['action', 'arcade', 'puzzle', 'racing', 'sports', 'casual'];
      const icons = ['🕹️', '🚗', '🧩', '⚽', '🎯', '🚀', '🥊', '🏀', '🏎️', '🧠', '⚡', '🔥'];
      const category = categories[i % categories.length];
      const icon = icons[i % icons.length];
      
      // Using reliable embed endpoints to prevent origin errors
      const titles = [
        "Subway Surfers Runner", "Moto X3M Bike Race", "Bubble Shooter Pro", "8 Ball Pool Billiards", "Cut the Rope Physics",
        "Drift Boss Racing", "Stickman Hook", "Pac-Xon Deluxe", "Penalty Kick Star", "2048 Puzzle Master",
        "Hill Climb Driver", "Flappy Bird 3D", "Slither Snake IO", "Archery World Tour", "Uno Card Online",
        "Traffic Rush Arena", "Solitaire Deluxe", "Fireboy Watergirl Maze", "Fruit Ninja Slash", "Basketball Legends",
        "Temple Run 2D", "Knife Hit Challenge", "Run 3 Space Edition", "Crossy Road Arcade", "Vex 6 Platformer",
        "Color Switch Tap", "Sling Drift Pro", "Mahjong Dimensions", "Paper IO Multiplayer", "Soccer World Cup",
        "Master Checkers", "Madalin Stunt Cars", "Stack Smash 3D", "Word Chef Puzzle", "Geometry Dash Neon",
        "Table Tennis Pro", "Asphalt Retro Racer", "Among Us Space", "Bubble Woods Shooter", "Tetris Cube Classic",
        "Classic Bowling 3D", "Ludo Hero Deluxe", "Super Mario Runner", "Traffic Command", "Golf Adventures",
        "Jewel Academy Blast", "Car Rush Highway", "Tic Tac Toe Arena", "Angry Heroes Physics", "Hexa Puzzle Legend"
      ];

      const title = titles[i] || `Arcade Game ${id}`;

      return {
        id,
        title,
        category,
        icon,
        url: `https://html5.gamedistribution.com/rvvASd10072023/?gd_sdk_referrer_url=https://megaarcade.com/game-${id}`
      };
    });

    let currentCategory = 'all';

    function renderGames(gameList) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';

      if (gameList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No matching games found.</p>';
        return;
      }

      gameList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGame(game.title, game.url);
        card.innerHTML = `
          <div class="thumbnail-box">
            <span class="thumbnail-icon">${game.icon}</span>
            <span class="thumbnail-text">Play Now</span>
          </div>
          <div class="game-info">
            <div class="game-title">${game.title}</div>
            <div class="game-cat">${game.category}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGame(title, url) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('gameIframe').src = url;
      document.getElementById('playerModal').classList.add('active');
    }

    function closeGame() {
      document.getElementById('playerModal').classList.remove('active');
      document.getElementById('gameIframe').src = '';
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    function toggleFullScreen() {
      const container = document.getElementById('playerContainer');
      if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
          alert('Error attempting to enable full-screen mode: ' + err.message);
        });
      } else {
        document.exitFullscreen();
      }
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterGames();
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = games.filter(game => {
        const matchesCat = currentCategory === 'all' || game.category === currentCategory;
        const matchesQuery = game.title.toLowerCase().includes(query) || game.category.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderGames(filtered);
    }

    renderGames(games);
  </script>
</body>
</html>
