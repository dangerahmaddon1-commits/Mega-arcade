    .header-container {

      display: flex;

      align-items: center;

      flex-wrap: wrap;

      display: flex;

      background: #0f172a;
      border-bottom: 1px solid var(--border-color);

      border-radius: 8px;
      font-size: 0.8rem;

      align-items: center;

      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;

      color: #0b0f19;
      border-color: var(--accent-glow);
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1.25rem;
    }

    .game-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      border-color: var(--accent-glow);
    }

    .thumbnail-container {
      width: 100%;
      aspect-ratio: 4/3;
      background: #070a12;
      overflow: hidden;
      position: relative;
    }

    .thumbnail-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }

    .game-card:hover .thumbnail-img {
      transform: scale(1.05);
    }

    .game-info {
      padding: 0.75rem;

      gap: 0.25rem;

      color: var(--text-muted);
      text-transform: capitalize;
    }

      position: fixed;

      flex-direction: column;
      align-items: center;

      { id: 49, title: "Angry Heroes", category: "action", thumb: "https://img.gamedistribution.com/8323282eb1104e6c9f6d7eb53982e564-512x512.jpeg", url: "https://html5.gamedistribution.com/8323282eb1104e6c9f6d7eb53982e564/" },
      { id: 50, title: "Hexa Puzzle Legend", category: "puzzle", thumb: "https://img.gamedistribution.com/5b8f2d59e38e4a9e9a40a58140f0d256-512x512.jpeg", url: "https://html5.gamedistribution.com/5b8f2d59e38e4a9e9a40a58140f0d256/" }
    ];

    let currentCategory = 'all';

    function renderGames(gameList) {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '';

      if (gameList.length === 0) {
        grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No matching games found.</p>';
        return;
      }

      gameList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => openGame(game.title, game.url);
        card.innerHTML = `
          <div class="thumbnail-container">
            <img class="thumbnail-img" src="${game.thumb}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/512x512/111827/38bdf8?text=${encodeURIComponent(game.title)}'">
          </div>
          <div class="game-info">
            <div class="game-title">${game.title}</div>
            <div class="game-cat">${game.category}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function openGame(title, url) {
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('gameIframe').src = url;
      document.getElementById('playerModal').classList.add('active');
    }

    function closeGame() {
      document.getElementById('playerModal').classList.remove('active');
      document.getElementById('gameIframe').src = '';
    }

    function filterCategory(cat, btn) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterGames();
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = games.filter(game => {
        const matchesCat = currentCategory === 'all' || game.category === currentCategory;
        const matchesQuery = game.title.toLowerCase().includes(query) || game.category.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderGames(filtered);
    }

    renderGames(games);
  </script>
</body>
</html>
